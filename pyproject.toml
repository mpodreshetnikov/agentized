[project]
name = "agentized"
version = "0.1.0"
description = "Agent team coordination layer over git"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "coverage[toml]>=7.0",
  "mutmut>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/quality"]
pythonpath = ["runtime"]

[tool.coverage.run]
branch = true
source = ["runtime/agentized"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0

[tool.coverage.paths]
source = ["runtime/agentized"]
