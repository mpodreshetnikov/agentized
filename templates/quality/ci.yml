# AGENTIZED:QUALITY — CI quality gates via self-contained agentized CLI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies (if present)
        run: |
          if [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt
          else
            echo "no requirements-dev.txt — skip"
          fi

      - name: Ruff format (changed files)
        run: |
          set -euo pipefail
          if ! command -v ruff >/dev/null 2>&1; then
            pip install 'ruff>=0.8'
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [[ -z "${BASE}" || "${BASE}" == "0000000000000000000000000000000000000000" ]]; then
              BASE="$(git rev-parse HEAD^)"
            fi
          fi
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "${BASE}"...HEAD -- '*.py' || true)
          if ((${#FILES[@]} == 0)); then
            echo "no changed Python files — skip ruff format"
            exit 0
          fi
          echo "ruff format --check (${#FILES[@]} file(s) vs ${BASE})"
          printf '  %s\n' "${FILES[@]}"
          ruff format --check -- "${FILES[@]}"

      - name: Mechanical checks (if present)
        run: |
          if [[ -x ./tests/test_mechanical.sh ]]; then
            ./tests/test_mechanical.sh
          else
            echo "no ./tests/test_mechanical.sh — skip"
          fi

      - name: Coverage + mutation hard gates
        env:
          MUTATION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          if [[ -x ./bin/agentized ]]; then
            CLI=(./bin/agentized)
          elif [[ -f runtime/agentized_cli.py ]]; then
            CLI=(python3 runtime/agentized_cli.py)
          elif command -v agentized >/dev/null 2>&1; then
            CLI=(agentized)
          else
            echo "agentized CLI not found" >&2
            exit 1
          fi
          "${CLI[@]}" process size
          "${CLI[@]}" quality check

      - name: Upload coverage + mutation + gate summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            coverage/combined-summary.json
            coverage/combined-report.md
            reports/mutation/mutation-summary.json
            reports/test-smells/test-smells-summary.json
            reports/architecture/architecture-summary.json
          if-no-files-found: warn
