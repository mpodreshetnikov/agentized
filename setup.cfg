[mutmut]
# Top-level `agentized` symlink → runtime/agentized so trampoline keys match imports.
source_paths = agentized
mutate_only_covered_lines = false
use_git_change_detection = false
# Equivalent lexemes (Python treats these the same) — do not count as survivors.
ignore_lexemes =
  utf-8
  UTF-8
also_copy =
  tests/
  context/
  pyproject.toml
  setup.cfg

pytest_add_cli_args_test_selection =
  tests/unit/test_connect_authorship.py
  tests/unit/test_connect_authorship_e2e.py
  tests/unit/test_connect_consumer_e2e.py
  tests/unit/test_connect_external.py
  tests/unit/test_connect_hook_merge_oracles.py
  tests/unit/test_connect_install_claude_oracles.py
  tests/unit/test_connect_install_codex_oracles.py
  tests/unit/test_connect_install_cursor_oracles.py
  tests/unit/test_connect_managed_hash.py
  tests/unit/test_connect_quality.py
  tests/unit/test_connect_result.py
  tests/unit/test_connect_reviewer_pin_oracles.py
  tests/unit/test_connect_skeleton.py
  tests/unit/test_connect_skeleton_oracles.py
  tests/unit/test_connect_skills_pin_oracles.py
  tests/unit/test_connect_tree_helper_oracles.py
  tests/unit/test_connect_upsert_env_quality_oracles.py
  tests/unit/test_merge_policy_defaults.py
  tests/unit/test_merge_policy_io.py

only_mutate =
  agentized/connect.py
  agentized/merge_policy_defaults.py
  agentized/merge_policy_io.py
