[mutmut]
# Durable mutmut defaults for Agentized dogfood.
# scripts/quality/run_mutation.py temporarily sets only_mutate to changed files.
source_paths = runtime/agentized
pytest_add_cli_args_test_selection = tests/unit
mutate_only_covered_lines = true
use_git_change_detection = false
also_copy =
  tests/
  runtime/
  context/quality.json
  pyproject.toml
  setup.cfg
